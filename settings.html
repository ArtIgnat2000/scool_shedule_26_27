<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>⚙️ Настройки · Школьное расписание</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <header class="topbar">
            <div class="topbar-main">
                <div class="title-block">
                    <h1>Настройки</h1>
                    <p class="subtitle">Класс и учебный график</p>
                </div>
                <nav class="nav" aria-label="Основная навигация">
                    <a href="index.html"><span aria-hidden="true">📚</span><span>Уроки</span></a>
                    <a href="holidays.html"><span aria-hidden="true">🌴</span><span>Каникулы</span></a>
                    <a href="student.html"><span aria-hidden="true">👤</span><span>Моё</span></a>
                    <a href="meal.html"><span aria-hidden="true">🍽️</span><span>Еда</span></a>
                </nav>
                <a class="settings-button current" href="settings.html" aria-label="Настройки" aria-current="page" title="Настройки">
                    <span aria-hidden="true">⚙️</span>
                </a>
            </div>
        </header>

        <main>
            <div class="card settings-card">
                <div class="section-kicker">Профиль</div>
                <h2>Класс</h2>
                <div class="segmented large" id="class-switch"></div>
                <p class="setting-note" id="class-note"></p>
            </div>

            <div class="card settings-card">
                <div class="section-kicker">Учебный год</div>
                <h2>Система обучения</h2>
                <div class="segmented" id="system-switch"></div>
                <p class="setting-note" id="system-note"></p>
            </div>

            <div class="card settings-card">
                <div class="section-kicker">Готово</div>
                <h2>Настройки сохранены</h2>
                <p class="hint">Выбор хранится в этом браузере и применяется на страницах расписания и календаря.</p>
                <a class="action-button" id="open-schedule" href="index.html">Открыть расписание <span aria-hidden="true">→</span></a>
            </div>
        </main>

        <footer>© 2026–2027 · Школьное расписание v2.1.0</footer>
    </div>

    <script src="js/data.js"></script>
    <script src="js/settings.js"></script>
</body>
</html>
