<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>📚 Школьное расписание</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="page">
        <div class="topbar">
            <div class="title-block">
                <h1>Расписание</h1>
                <p class="subtitle" id="page-subtitle">Загрузка…</p>
            </div>
            <nav class="nav">
                <a href="index.html" class="current">📚 Уроки</a>
                <a href="holidays.html">🌴 Каникулы</a>
                <a href="student.html">👤 Моё расписание</a>
                <a href="https://artignat2000.github.io/meal-schedule/">🍽️ Еда</a>
            </nav>
        </div>

        <div class="card">
            <h2>Класс</h2>
            <div class="segmented large" id="class-switch"></div>
        </div>

        <div class="card">
            <div class="segmented" id="day-switch"></div>
            <h2 id="day-title" style="margin-top:14px;">&nbsp;</h2>
            <div id="schedule-content">
                <div class="loading">Загрузка расписания…</div>
            </div>
        </div>

        <div class="card">
            <h2>Границы оценок</h2>
            <div class="rating-grid">
                <span class="rating-pill r">40–69</span><span class="rating-desc">3 — удовлетворительно</span>
                <span class="rating-pill y">70–84</span><span class="rating-desc">4 — хорошо</span>
                <span class="rating-pill g">85–100</span><span class="rating-desc">5 — отлично</span>
            </div>
        </div>

        <footer>© 2026–2027 · Школьное расписание v2.0</footer>
    </div>

    <script src="js/data.js"></script>
    <script src="js/schedule.js"></script>
</body>
</html>
